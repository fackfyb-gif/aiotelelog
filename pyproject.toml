[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "funstat-client"
version = "0.1.0"
description = "Minimal async Python client for the funstat API"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.7,<3",
]

[tool.setuptools.packages.find]
where = ["src"]
